<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>视觉审阅 · 区域与文字</title>
<style>
[hidden]{display:none!important}*{box-sizing:border-box}body{margin:0;background:#eef0e9;color:#243a2e;font:14px/1.5 -apple-system,'PingFang SC',sans-serif}header{height:68px;background:#fafbf6;border-bottom:1px solid #d4dccf;display:flex;align-items:center;gap:20px;padding:0 22px}header strong{font-size:19px}main{display:grid;grid-template-columns:minmax(0,1fr) 330px;height:calc(100vh - 68px)}.viewer{padding:16px;min-width:0;overflow:auto}.tools{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-bottom:12px}.stage{background:#dde2d8;border:1px solid #c4cebe;border-radius:9px;overflow:auto;min-height:400px;position:relative}.image-wrap{position:relative;margin:auto;line-height:0}.image-wrap>canvas{position:absolute;inset:0;width:100%;height:100%}iframe{display:block;border:0;background:#fff}.stage .canvas-container{position:relative!important}aside{padding:18px;background:#fafbf6;border-left:1px solid #d4dccf;overflow:auto}label{display:grid;gap:5px;margin-bottom:12px}button,select,textarea{font:inherit;border:1px solid #a8b7a4;border-radius:6px;padding:7px 9px;background:#fff;color:inherit}button{cursor:pointer}button:disabled{opacity:.45;cursor:default}.primary{background:#22593f;color:white;border-color:#22593f}textarea{width:100%;resize:vertical}#target{background:#e8eee1;padding:12px;border-radius:7px;margin-bottom:14px;overflow-wrap:anywhere;white-space:pre-wrap;max-height:180px;overflow:auto}.row{display:flex;gap:7px;flex-wrap:wrap;margin:10px 0}small{color:#58704f}.tools label{margin:0;display:flex;align-items:center;gap:6px}#brush{width:105px}ol{padding-left:19px}li{padding:8px 0;border-bottom:1px solid #e0e5da;overflow-wrap:anywhere}li button{font-size:12px;padding:3px 6px;margin:5px 4px 0 0}#status{margin:12px 0;white-space:pre-wrap}#transfer[hidden]{display:none}.hint{margin:0 0 10px;color:#50644a}.badge{font-size:12px;background:#e8eee1;padding:3px 8px;border-radius:20px}@media(max-width:780px){main{display:block;height:auto}aside{border-left:0}header{height:auto;min-height:68px;flex-wrap:wrap;padding:12px}.stage{min-height:280px}}
</style><script src="fabric.js"></script><script type="module" src="app.js"></script></head>
<body><header><strong>视觉审阅</strong><span class="badge">文字 · 涂抹 · 区域</span><select id="asset" aria-label="选择文件"></select></header>
<main><section class="viewer" aria-label="画面"><div class="tools">
<select id="mode" aria-label="批注模式"><option value="text-range">选择文字</option><option value="element">点选元素</option><option value="brush">涂抹选区</option><option value="erase">擦除选区</option><option value="rect">矩形选区</option><option value="point">点位</option></select>
<label id="brush-label">笔刷<input id="brush" type="range" min="6" max="120" value="36"><output id="brush-value">36</output></label>
<button id="undo">撤销</button><button id="redo">重做</button><button id="clear">清空选区</button><button id="visibility">显示 / 隐藏</button>
<button id="smaller" aria-label="缩小图片">−</button><button id="larger" aria-label="放大图片">+</button>
</div><p class="hint" id="hint"></p><div class="stage" id="stage"></div></section>
<aside aria-label="反馈"><div id="target">选择文字，或涂抹你想修改的区域。</div><label>修改要求<textarea id="note" rows="3" maxlength="4000" placeholder="例如：将选中的杯身改成浅蓝色，保留花纹。"></textarea></label>
<div class="row"><button id="add" class="primary" disabled>加入批注</button><button id="save-draft">保存草稿</button></div><small id="draft-state">草稿会自动保存在本机。</small>
<ol id="notes"></ol><button id="submit" class="primary" disabled>保存并生成回传指令</button><div id="status" role="status"></div><div id="transfer" hidden><label>回传指令<textarea id="handoff" readonly rows="4"></textarea></label><button id="copy">复制回传指令</button></div>
</aside></main></body></html>
